version: 2

# Dependabot proposes minor and patch updates only. Major updates are planned and
# done by hand, because they can change the shipped plugin, companion or Visual.
updates:
  - package-ecosystem: composer
    directory: /plugin
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Abilities API polyfill stays on 0.1 until the minimum WordPress version is 6.9.
      - dependency-name: "wordpress/abilities-api"
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /companion
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      companion-npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /visual
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      visual-npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /e2e
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Newer releases pull php-wasm packages that need Node 24.18; the e2e job and local runs use Node 22.
      - dependency-name: "@wordpress/env"
    groups:
      e2e-npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
