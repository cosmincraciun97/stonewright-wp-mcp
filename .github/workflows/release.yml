name: Release

on:
  push:
    tags:
      - "v*"

# The token is read-only by default; only the publish job can write to the repository.
permissions:
  contents: read

# One release run per tag at a time. A run that is already building or publishing is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the repository hygiene scan below reads every commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          tools: composer

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            visual/package-lock.json

      - name: Verify documentation freshness
        run: node scripts/check-docs-freshness.mjs

      - name: Verify license metadata
        run: node scripts/check-license-metadata.mjs

      - name: Verify public repository hygiene
        env:
          STONEWRIGHT_PRIVATE_TERMS: ${{ secrets.STONEWRIGHT_PRIVATE_TERMS }}
        run: node scripts/check-public-hygiene.mjs --require-private-terms --history

      - name: Verify plugin
        working-directory: plugin
        run: |
          composer install --no-interaction --prefer-dist
          composer test
          composer phpstan
          composer phpcs
          composer security:audit
          composer dependencies:audit
          composer provenance:lint
          composer tokens:measure

      - name: Prepare production plugin dependencies
        working-directory: plugin
        run: |
          rm -rf vendor
          composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative
          composer package:verify-manifests

      - name: Build companion
        working-directory: companion
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run tokens:measure
          npm run build

      - name: Build Stonewright Visual
        working-directory: visual
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Stage Stonewright Visual into the plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugin/assets/visual
          cp visual/dist/workspace-browser.js plugin/assets/visual/workspace-browser.js
          node scripts/package-verify.mjs --require-visual-bundle --strict-vendor

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stonewright
          rsync -a plugin/ dist/stonewright/ \
            --exclude tests \
            --exclude bin \
            --exclude composer.json \
            --exclude composer.lock \
            --exclude .phpunit.cache \
            --exclude .phpunit.result.cache \
            --exclude phpstan.neon \
            --exclude phpcs.xml \
            --exclude phpunit.xml \
            --exclude phpunit.xml.dist \
            --exclude .github
          rsync -a skills/ dist/stonewright/skills/
          cp LICENSE dist/stonewright/LICENSE
          php plugin/bin/verify-jetpack-manifests.php dist/stonewright
          (cd dist && zip -qr "stonewright-${version}.zip" stonewright)
          (cd companion && npm pack --pack-destination ../dist)
          (cd visual && npm pack --pack-destination ../dist)
          companion_archive="$(find dist -maxdepth 1 -name 'stonewright-companion-*.tgz' -print -quit)"
          visual_archive="$(find dist -maxdepth 1 -name 'stonewright-visual-*.tgz' -print -quit)"
          mkdir -p dist/package-scan/companion dist/package-scan/visual
          tar -xzf "$companion_archive" -C dist/package-scan/companion
          tar -xzf "$visual_archive" -C dist/package-scan/visual
          if tar -tzf "$companion_archive" | grep -E '(^|/)(sites\.json|audit-direct\.jsonl)$|(^|/)memory/' >/dev/null; then
            echo "Companion archive contains private persistent runtime state" >&2
            exit 1
          fi
          rm -f dist/stonewright-visual-*.tgz
          if unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/(tests|bin)/|^stonewright/(phpunit|phpstan|phpcs)|^stonewright/composer\.lock$' >/dev/null; then
            echo "Plugin archive contains development-only files" >&2
            exit 1
          fi
          if unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/\.github(/|$)' >/dev/null; then
            echo "Plugin archive contains a .github folder" >&2
            exit 1
          fi
          if ! unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/LICENSE$' >/dev/null; then
            echo "Plugin archive is missing the canonical license" >&2
            exit 1
          fi
          if ! unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/assets/visual/workspace-browser\.js$' >/dev/null; then
            echo "Plugin archive is missing the Stonewright Visual bundle" >&2
            exit 1
          fi
          if ! unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/skills/agent-operating-rules/SKILL\.md$' >/dev/null; then
            echo 'plugin zip is missing the bundled skill pack' >&2
            exit 1
          fi
          if ! unzip -Z1 "dist/stonewright-${version}.zip" | grep -E '^stonewright/skills/playbooks/' >/dev/null; then
            echo 'plugin zip is missing the bundled playbooks' >&2
            exit 1
          fi
          (cd dist && sha256sum "stonewright-${version}.zip" "stonewright-companion-${version}.tgz" > SHA256SUMS.txt)
          node scripts/check-release-artifacts.mjs --version "$version" --dir dist --inspect --require-production-vendor

      # The private terms reach the scan steps through env only: they are never expanded
      # into a script and are not in the environment of the build and packaging tools.
      - name: Scan release packages for private terms
        env:
          STONEWRIGHT_PRIVATE_TERMS: ${{ secrets.STONEWRIGHT_PRIVATE_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-public-hygiene.mjs --root dist/stonewright --require-private-terms
          node scripts/check-public-hygiene.mjs --root dist/package-scan/companion --require-private-terms
          node scripts/check-public-hygiene.mjs --root dist/package-scan/visual --require-private-terms

      - name: Upload release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          path: |
            dist/stonewright-*.zip
            dist/stonewright-companion-*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: dist

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          node scripts/check-release-artifacts.mjs --version "$version" --dir dist

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing versioned release notes: $notes" >&2
            exit 1
          fi
          release_flag="$(node scripts/release-flags.mjs "$version" "$notes")"
          gh release create "$GITHUB_REF_NAME" \
            "dist/stonewright-${version}.zip" \
            "dist/stonewright-companion-${version}.tgz" \
            dist/SHA256SUMS.txt \
            --title "Stonewright ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            "$release_flag"
