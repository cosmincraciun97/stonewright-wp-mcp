name: CI

on:
  pull_request:
  push:
    branches:
      - main

# The token is read-only for every job; a job that needs more declares its own permissions block.
permissions:
  contents: read

# A pull request has one run at a time: a newer push cancels the older run.
# Each push to main has its own group and always runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: node scripts/check-docs-freshness.mjs
      - run: node scripts/check-license-metadata.mjs
      - run: node --test scripts/tests/release-flags.test.mjs scripts/tests/release-artifacts.test.mjs
      - name: Verify public repository hygiene
        env:
          STONEWRIGHT_PRIVATE_TERMS: ${{ secrets.STONEWRIGHT_PRIVATE_TERMS }}
        run: node scripts/check-public-hygiene.mjs

  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer contracts:compat

  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan
      - run: composer phpcs
      - run: composer security:audit
      - run: composer dependencies:audit
      - run: composer provenance:lint
      - run: composer tokens:measure

  plugin-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          tools: composer
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Build clean production dependencies
        working-directory: plugin
        run: composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative
      - name: Verify production package integrity
        run: |
          node scripts/check-license-metadata.mjs
          php plugin/bin/verify-jetpack-manifests.php plugin
          node scripts/package-verify.mjs --strict-vendor
      - name: Verify release exclusions preserve manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-scan/stonewright
          rsync -a plugin/ package-scan/stonewright/ \
            --exclude tests \
            --exclude bin \
            --exclude composer.json \
            --exclude composer.lock \
            --exclude .phpunit.cache \
            --exclude .phpunit.result.cache \
            --exclude phpstan.neon \
            --exclude phpcs.xml \
            --exclude phpunit.xml \
            --exclude phpunit.xml.dist
          php plugin/bin/verify-jetpack-manifests.php package-scan/stonewright
          cp LICENSE package-scan/stonewright/LICENSE
          rsync -a skills/ package-scan/stonewright/skills/
          (cd package-scan && zip -qr ../stonewright-ci.zip stonewright)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: plugin-zip
          path: stonewright-ci.zip
          retention-days: 3

  plugin-zip-activation:
    # Installs and activates the built ZIP on WordPress + SQLite with a missing
    # openssl.cnf, the Windows (Laragon/XAMPP) condition behind issue #78.
    needs: plugin-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.1", "8.3"]
        exclude:
          # The SQLite drop-in used to stand up WordPress fails `core install`
          # on the Windows PHP 8.1 build; the plugin itself is not involved.
          # PHP 8.1 stays covered on Linux, Windows covers 8.2 and 8.3.
          - os: windows-latest
            php: "8.1"
        include:
          - os: windows-latest
            php: "8.2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, zip, pdo_sqlite, sqlite3, curl, mbstring
          tools: none
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: plugin-zip
      - name: Activate the plugin ZIP without an OpenSSL config
        run: php scripts/smoke-plugin-zip-activation.php --zip=stonewright-ci.zip --wp=7.1.2

  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run contracts:compat
      - run: npm test
      - run: npm run tokens:measure
      - run: npm run build
      - name: Verify companion archive hygiene
        working-directory: .
        env:
          STONEWRIGHT_PRIVATE_TERMS: ${{ secrets.STONEWRIGHT_PRIVATE_TERMS }}
        run: |
          mkdir -p package-scan/unpacked
          (cd companion && npm pack --pack-destination ../package-scan)
          companion_archive="$(find package-scan -maxdepth 1 -name 'stonewright-companion-*.tgz' -print -quit)"
          tar -xzf "$companion_archive" -C package-scan/unpacked
          node scripts/check-public-hygiene.mjs --root package-scan/unpacked
          if tar -tzf "$companion_archive" | grep -Eq '(^|/)(sites\.json|audit-direct\.jsonl)$|(^|/)memory/'; then
            echo "Companion archive contains private persistent runtime state" >&2
            exit 1
          fi

  companion-windows-oauth:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - name: Verify native OAuth persistence and privacy
        run: npx --no-install vitest run tests/oauth-token-store.test.ts tests/oauth-token-manager.test.ts tests/oauth-matrix.test.ts tests/oauth-refresh-lock.test.ts tests/wordpress-mcp-oauth.test.ts tests/oauth-seven-day.integration.test.ts tests/oauth-windows-privacy.test.ts
      - run: npm run build
      - name: Verify native ACL source is included in the companion package
        run: |
          $manifest = npm pack --dry-run --ignore-scripts --json | ConvertFrom-Json
          if (@($manifest.files.path) -notcontains 'data/oauth-windows-acl.cs') {
            throw 'OAuth privacy source is missing from the companion package.'
          }

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visual
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visual/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the packaged plugin can carry the built bundle
        working-directory: .
        run: |
          mkdir -p plugin/assets/visual
          cp visual/dist/workspace-browser.js plugin/assets/visual/workspace-browser.js
          node scripts/package-verify.mjs --require-visual-bundle

  e2e-admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          tools: composer
      - name: Install plugin production dependencies
        working-directory: plugin
        run: composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative
      - name: Install synthetic MCP provider dependencies
        working-directory: e2e/fixtures/synthetic-mcp-provider
        run: composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Collect Playwright tests before environment start
        run: |
          set -euo pipefail
          output="$(npx --no-install playwright test --list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'mcp-registration.spec.ts'
          total="$(printf '%s\n' "$output" | sed -n 's/^Total: \([0-9][0-9]*\) tests.*/\1/p' | tail -n 1)"
          test "${total:-0}" -gt 0
      - run: npx playwright install --with-deps chromium
      - name: Build the Stonewright Visual bundle
        working-directory: visual
        run: |
          npm ci
          npm run build
      - name: Stage the bundle into the plugin
        working-directory: .
        run: |
          mkdir -p plugin/assets/visual
          cp visual/dist/workspace-browser.js plugin/assets/visual/workspace-browser.js
      - name: Build the exact plugin archive used by wp-env
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p dist/e2e/stonewright dist/e2e-unpacked
          rsync -a plugin/ dist/e2e/stonewright/ \
            --exclude tests \
            --exclude bin \
            --exclude composer.json \
            --exclude composer.lock \
            --exclude .phpunit.cache \
            --exclude .phpunit.result.cache \
            --exclude phpstan.neon \
            --exclude phpcs.xml \
            --exclude phpunit.xml \
            --exclude phpunit.xml.dist
          php plugin/bin/verify-jetpack-manifests.php dist/e2e/stonewright
          (cd dist/e2e && zip -qr stonewright.zip stonewright)
          unzip -q dist/e2e/stonewright.zip -d dist/e2e-unpacked
          php plugin/bin/verify-jetpack-manifests.php dist/e2e-unpacked/stonewright
      - name: Start wp-env
        run: npx wp-env start --config .wp-env.package.json
      - name: Run admin-ui Playwright suite
        env:
          WP_BASE_URL: http://localhost:8888
          WP_USERNAME: admin
          WP_PASSWORD: password
          CI: "true"
        run: npx playwright test
      - name: Stop wp-env
        if: always()
        run: npx wp-env stop --config .wp-env.package.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: e2e-admin-ui-artifacts
          path: |
            e2e/artifacts/
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
