name: History hygiene

# Manual run of the release workflow's Git history scan: every commit on every
# fetched branch and tag is checked for the configured private terms.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-hygiene
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Scan the Git history for private terms
        env:
          STONEWRIGHT_PRIVATE_TERMS: ${{ secrets.STONEWRIGHT_PRIVATE_TERMS }}
        run: node scripts/check-public-hygiene.mjs --require-private-terms --history
