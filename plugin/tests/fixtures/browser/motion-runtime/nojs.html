<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Stonewright motion no-JS UAT</title>
	<link rel="stylesheet" href="../../../../assets/frontend/motion-core.css?uat=2">
	<style>
		body { font: 16px/1.5 system-ui, sans-serif; }
		main { max-width: 44rem; margin: 4rem auto; padding: 1rem; }
	</style>
</head>
<body>
	<main>
		<h1 data-uat="nojs-entrance" class="stw-motion-fade-up stw-motion-trigger--load">Visible without JavaScript</h1>
		<div data-uat="nojs-stagger" class="stw-motion-stagger-reveal">
			<p>Visible stagger child</p>
		</div>
	</main>
</body>
</html>
